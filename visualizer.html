<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Learn Arduino - Interactive Circuit Workbench</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4ecdf; color: #2c221e; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* Top Navigation Bar */
        header {
            background-color: #faf5ec;
            border-bottom: 2px solid #e2d3be;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { background: #1e1e1e; color: #fff; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; }
        .title-text h1 { font-size: 16px; letter-spacing: 1px; color: #1e1e1e; font-weight: 800; }
        .title-text span { font-size: 10px; text-transform: uppercase; color: #8c7a6b; letter-spacing: 2px; }

        .toolbar { display: flex; gap: 12px; align-items: center; }
        .btn { background: #1e1e1e; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #333; }
        .btn-green { background: #2d8a4e; }
        .btn-green:hover { background: #236e3e; }

        /* Main Workspace Layout */
        .workspace { display: flex; flex: 1; position: relative; overflow: hidden; height: calc(100vh - 130px); }
        #canvas-container { flex: 1; height: 100%; position: relative; background: #ece2d0; }

        /* Right Panel: Wiring Manager & Code */
        .right-panel {
            width: 360px;
            background: #faf5ec;
            border-left: 2px solid #e2d3be;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-shadow: -4px 0 15px rgba(0,0,0,0.03);
            flex-shrink: 0;
            overflow-y: auto;
        }
        .section-title { font-size: 12px; font-weight: 700; color: #8c7a6b; text-transform: uppercase; margin-bottom: 8px; }
        .control-group { margin-bottom: 14px; }
        .control-group label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 4px; color: #5a4d41; }
        .control-group select, .control-group input { width: 100%; padding: 6px 10px; border: 1px solid #dcd1c0; border-radius: 6px; font-size: 12px; background: #fff; }

        .connection-log {
            background: #fff;
            border: 1px solid #dcd1c0;
            border-radius: 6px;
            height: 140px;
            overflow-y: auto;
            padding: 8px;
            font-size: 11px;
            font-family: monospace;
            margin-bottom: 14px;
        }
        .log-item { padding: 4px 6px; border-bottom: 1px solid #f0e6d6; display: flex; justify-content: space-between; }

        /* Bottom Lessons Dock */
        .lessons-dock {
            height: 80px;
            background: #faf5ec;
            border-top: 2px solid #e2d3be;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .lesson-card {
            background: #ffffff;
            border: 1px solid #e2d3be;
            border-radius: 6px;
            padding: 8px 12px;
            min-width: 140px;
            cursor: pointer;
        }
        .lesson-card.active { border: 2px solid #1e1e1e; background: #fffcf7; }
        .lesson-card span { font-size: 9px; color: #8c7a6b; font-weight: 700; text-transform: uppercase; }
        .lesson-card h4 { font-size: 11px; font-weight: 700; color: #1e1e1e; margin-top: 2px; }
    </style>
    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">⚡</div>
            <div class="title-text">
                <h1>LEARN ARDUINO</h1>
                <span>Interactive 3D Workbench</span>
            </div>
        </div>
        <div class="toolbar">
            <span style="font-size: 12px; font-weight: 600; color: #5a4d41;">Mode: 🔌 Circuit Wiring</span>
        </div>
        <div style="font-size: 11px; font-weight: 600; color: #8c7a6b;">ECE Project v1.0</div>
    </header>

    <div class="workspace">
        <div id="canvas-container"></div>

        <div class="right-panel">
            <div class="section-title">🔌 Jumper Wire Connection Tool</div>
            
            <div class="control-group">
                <label>From Component / Pin</label>
                <select id="start-pin">
                    <option value="Arduino 5V">Arduino: 5V Power Pin</option>
                    <option value="Arduino GND">Arduino: GND Ground Pin</option>
                    <option value="Arduino D13">Arduino: Digital Pin 13 (LED)</option>
                    <option value="Arduino D2">Arduino: Digital Pin 2 (Button)</option>
                    <option value="LED Anode (+)">LED: Anode (+)</option>
                    <option value="LED Cathode (-)">LED: Cathode (-)</option>
                    <option value="Resistor Terminal 1">Resistor: Terminal 1</option>
                    <option value="Resistor Terminal 2">Resistor: Terminal 2</option>
                    <option value="Button Terminal 1">Push Button: Terminal 1</option>
                </select>
            </div>

            <div class="control-group">
                <label>To Component / Pin</label>
                <select id="end-pin">
                    <option value="LED Anode (+)">LED: Anode (+)</option>
                    <option value="Resistor Terminal 1">Resistor: Terminal 1</option>
                    <option value="Resistor Terminal 2">Resistor: Terminal 2</option>
                    <option value="Arduino GND">Arduino: GND Ground Pin</option>
                    <option value="Arduino D13">Arduino: Digital Pin 13 (LED)</option>
                    <option value="Button Terminal 2">Push Button: Terminal 2</option>
                </select>
            </div>

            <div class="control-group">
                <label>Wire Color</label>
                <select id="wire-color">
                    <option value="red">🔴 Red (VCC / Power)</option>
                    <option value="black">⚫ Black (Ground)</option>
                    <option value="blue">🔵 Blue (Signal)</option>
                    <option value="green">🟢 Green (Data)</option>
                    <option value="orange">🟠 Orange (GPIO)</option>
                </select>
            </div>

            <button class="btn btn-green" onclick="addWire()" style="width:100%; padding: 8px; margin-bottom: 12px;">➕ Connect Jumper Wire</button>
            <button class="btn" onclick="clearWires()" style="width:100%; background:#c0392b; margin-bottom: 16px;">🗑️ Clear All Wires</button>

            <div class="section-title">📋 Active Circuit Connections</div>
            <div class="connection-log" id="wire-log">
                <div class="log-item"><span>Arduino 5V ⟷ LED Anode (+)</span> <strong style="color:red">●</strong></div>
            </div>
        </div>
    </div>

    <div class="lessons-dock">
        <div class="lesson-card active">
            <span>Lesson 1</span>
            <h4>Circuit Breadboarding</h4>
        </div>
        <div class="lesson-card">
            <span>Lesson 2</span>
            <h4>Blink an LED</h4>
        </div>
        <div class="lesson-card">
            <span>Lesson 3</span>
            <h4>Push a Button</h4>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const width = container.clientWidth || window.innerWidth * 0.7;
        const height = container.clientHeight || window.innerHeight - 130;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4ecdf);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 12, 16);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 1. RENDER ARDUINO UNO ---
        const arduinoGroup = new THREE.Group();
        const pcb = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.2, 3.5), new THREE.MeshStandardMaterial({ color: 0x1a4b84 }));
        arduinoGroup.add(pcb);
        
        // USB & Chip
        const usb = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.6, 1.0), new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.8 }));
        usb.position.set(-1.8, 0.4, 0);
        arduinoGroup.add(usb);
        arduinoGroup.position.set(-3.5, 0, 0);
        scene.add(arduinoGroup);

        // --- 2. RENDER BREADBOARD ---
        const breadboard = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.3, 3.5), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }));
        breadboard.position.set(2.5, 0, 0);
        scene.add(breadboard);

        // --- 3. RENDER COMPONENTS ON BREADBOARD ---
        // LED
        const ledGroup = new THREE.Group();
        const ledDome = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0xe74c3c, transparent: true, opacity: 0.9 }));
        ledDome.position.set(0, 0.5, 0);
        ledGroup.add(ledDome);
        ledGroup.position.set(1.5, 0.15, -0.5);
        scene.add(ledGroup);

        // Resistor
        const resistor = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.8), new THREE.MeshStandardMaterial({ color: 0xd4ac0d }));
        resistor.rotation.z = Math.PI / 2;
        resistor.position.set(1.5, 0.3, 0.8);
        scene.add(resistor);

        // Coordinate Mapping for Pins & Components
        const pinCoords = {
            "Arduino 5V": new THREE.Vector3(-3.5, 0.3, -1.2),
            "Arduino GND": new THREE.Vector3(-3.5, 0.3, -0.8),
            "Arduino D13": new THREE.Vector3(-3.5, 0.3, 0.8),
            "Arduino D2": new THREE.Vector3(-3.5, 0.3, 1.2),
            "LED Anode (+)": new THREE.Vector3(1.5, 0.6, -0.5),
            "LED Cathode (-)": new THREE.Vector3(1.5, 0.2, -0.5),
            "Resistor Terminal 1": new THREE.Vector3(1.5, 0.3, 0.4),
            "Resistor Terminal 2": new THREE.Vector3(1.5, 0.3, 1.2),
            "Button Terminal 1": new THREE.Vector3(3.0, 0.3, 0)
        };

        // Wire Storage Array
        const wiresGroup = new THREE.Group();
        scene.add(wiresGroup);

        // Initial default wire
        drawWire("Arduino 5V", "LED Anode (+)", "red");

        function drawWire(startName, endName, colorName) {
            const p1 = pinCoords[startName];
            const p2 = pinCoords[endName];
            if (!p1 || !p2) return;

            const curve = new THREE.QuadraticBezierCurve3(
                p1,
                new THREE.Vector3((p1.x + p2.x) / 2, Math.max(p1.y, p2.y) + 1.8, (p1.z + p2.z) / 2),
                p2
            );

            const points = curve.getPoints(50);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: colorName, linewidth: 4 });
            const wireLine = new THREE.Line(geometry, material);
            wiresGroup.add(wireLine);
        }

        function addWire() {
            const start = document.getElementById('start-pin').value;
            const end = document.getElementById('end-pin').value;
            const color = document.getElementById('wire-color').value;

            if (start === end) {
                alert("Cannot connect a pin to itself!");
                return;
            }

            drawWire(start, end, color);

            // Add to log
            const logBox = document.getElementById('wire-log');
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<span>${start} ⟷ ${end}</span> <strong style="color:${color}">●</strong>`;
            logBox.appendChild(item);
        }

        function clearWires() {
            while(wiresGroup.children.length > 0){ 
                wiresGroup.remove(wiresGroup.children[0]); 
            }
            document.getElementById('wire-log').innerHTML = '<div class="log-item"><span>All wires cleared</span></div>';
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>
</html>
